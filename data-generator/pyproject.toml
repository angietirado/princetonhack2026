[project]
name = "spending-data-generator"
version = "0.1.0"
description = "Standalone synthetic fixtures and Nessie v2 historical simulation CLI"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "python-dotenv>=1,<2"]

[project.scripts]
generate-data = "spending_generator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spending_generator"]
