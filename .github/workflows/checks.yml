name: Checks
on: [push, pull_request]
jobs:
  merchant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example --profile tools run --build --rm backend-tests
      - run: docker compose --env-file .env.example --profile tools run --build --rm dashboard-tests
      - run: docker compose --env-file .env.example up --build --detach --wait --wait-timeout 120
      - run: docker compose --env-file .env.example exec -T backend python scripts/smoke_owner.py
      - run: docker compose --env-file .env.example --profile tools run --build --no-deps --rm browser-tests
      - name: Show logs on failure
        if: failure()
        run: docker compose --env-file .env.example logs --no-color
      - name: Stop stack and preserve data
        if: always()
        run: docker compose --env-file .env.example down
