# Isolated AI development: generated fixture data, no live Nessie reads.
# Credentials belong only in .env. Change provider to "nemotron" to use NVIDIA.
data_source = "fixture"
fixture_path = ".data/demo.json"
cors_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]
photon_enabled = false

llm_enabled = true
llm_provider = "gemini"
gemini_model = "gemini-3.8-flash"
nemotron_model = "nvidia/nemotron-3.5-lightning-30b-a3b"
llm_max_model_turns = 4
llm_max_tool_calls = 6
llm_timeout_seconds = 45
llm_max_output_tokens = 1024

costar_enabled = false
costar_data_dir = "/app/costardata"
# costar_snapshot_date is intentionally unset: a file date is not an availability date.
