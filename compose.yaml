x-generator: &generator
  build:
    context: .
    target: data-generator
  volumes:
    - app-data:/app/.data
    - ${APP_SETTINGS_FILE:-./settings.toml}:/app/settings.toml:ro
  environment:
    APP_SETTINGS_FILE: /app/settings.toml
    NESSIE_API_KEY: ${NESSIE_API_KEY:-}
  read_only: true
  tmpfs:
    - /tmp

services:
  data-init:
    <<: *generator
    entrypoint: ["python", "/app/docker/ensure_fixture.py"]
    # Offline initialization needs no provider credentials.
    environment: {}
    restart: "no"

  backend:
    build:
      context: .
      target: backend
    environment:
      APP_SETTINGS_FILE: /app/settings.toml
      NESSIE_API_KEY: ${NESSIE_API_KEY:-}
      APP_API_TOKEN: ${APP_API_TOKEN:-}
      PHOTON_API_KEY: ${PHOTON_API_KEY:-}
      PHOTON_WEBHOOK_SECRET: ${PHOTON_WEBHOOK_SECRET:-}
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - app-data:/app/.data
      - ${APP_SETTINGS_FILE:-./settings.toml}:/app/settings.toml:ro
    depends_on:
      data-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    init: true

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: frontend
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp

  generator:
    <<: *generator
    profiles: ["tools"]

  backend-tests:
    build:
      context: .
      target: backend-tests
    profiles: ["tools"]
    read_only: true
    tmpfs:
      - /tmp

  dashboard-tests:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: dashboard-tests
    profiles: ["tools"]
    read_only: true
    tmpfs:
      - /tmp
    environment:
      npm_config_cache: /tmp/npm-cache

volumes:
  app-data:
