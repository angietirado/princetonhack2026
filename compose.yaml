name: campus-exchange

services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CAMPUS_MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  backend:
    build: ./apps/backend
    restart: unless-stopped
    # Trust the local nginx proxy. On deployment, restrict this to your proxy IP
    # and do not publish the backend directly to an untrusted network.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: campus_exchange
      COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: http://localhost:${CAMPUS_WEB_PORT:-8080},http://127.0.0.1:${CAMPUS_WEB_PORT:-8080},http://localhost:5173,http://127.0.0.1:5173,http://localhost:${CAMPUS_API_PORT:-8001},http://127.0.0.1:${CAMPUS_API_PORT:-8001}
      STUDENT_CHECK_LIMIT_PER_HOUR: ${CAMPUS_STUDENT_CHECK_LIMIT_PER_HOUR:-30}
      DEVMODE: ${DEVMODE:-false}
    ports:
      - "127.0.0.1:${CAMPUS_API_PORT:-8001}:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build: ./apps/frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CAMPUS_WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:

