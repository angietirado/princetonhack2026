name: regulars-lab
services:
  backend:
    build:
      context: .
      target: merchant-backend
    mem_limit: 1g
    cpus: 1
    environment:
      OWNER_API_TOKEN: ${OWNER_API_TOKEN:-}
      OWNER_DATA_DIR: /app/.data
      OWNER_AI_ENABLED: ${OWNER_AI_ENABLED:-false}
      OWNER_AI_PROVIDER: ${OWNER_AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
    ports:
      - "127.0.0.1:8785:8765"
    volumes:
      - owner-data:/app/.data
    read_only: true
    tmpfs:
      - /tmp
    init: true
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: frontend
    mem_limit: 128m
    cpus: 0.5
    ports:
      - "127.0.0.1:5193:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
  backend-tests:
    build:
      context: .
      target: merchant-tests
    profiles: [tools]
    mem_limit: 1g
    cpus: 1
    read_only: true
    tmpfs:
      - /tmp
  dashboard-tests:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: dashboard-tests
    profiles: [tools]
    mem_limit: 512m
    cpus: 1
    read_only: true
    tmpfs:
      - /tmp
    environment:
      npm_config_cache: /tmp/npm-cache
      NODE_OPTIONS: --max-old-space-size=256
  nessie-import:
    build:
      context: .
      target: merchant-importer
    profiles: [tools]
    environment:
      NESSIE_API_KEY: ${NESSIE_API_KEY:-}
      OWNER_DATA_DIR: /app/.data
    volumes:
      - owner-data:/app/.data
    mem_limit: 512m
    cpus: 1
    read_only: true
    tmpfs:
      - /tmp
    init: true
  browser-tests:
    build:
      context: .
      dockerfile: docker/browser.Dockerfile
    profiles: [tools]
    environment:
      FRONTEND_URL: http://frontend:8080
    volumes:
      - ./.data/browser-artifacts:/artifacts
    mem_limit: 1g
    cpus: 1
    shm_size: 256m
    init: true
    depends_on:
      frontend:
        condition: service_healthy
volumes:
  owner-data:
