[project]
name = "spending-api"
version = "0.1.0"
description = "Blockwise shopping simulation and experiment analytics"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.8,<3",
  "langchain>=1.5,<2",
  "langgraph>=1.2,<2",
  "langchain-google-genai>=4.5,<5",
  "langchain-nvidia-ai-endpoints>=1.5,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spending_api"]
